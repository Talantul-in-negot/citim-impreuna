name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # PGlite (devDependency) rulează migrațiile reale într-un PostgreSQL local.
      - name: Install dev dependencies
        run: npm ci

      # Sintaxa fiecărui fișier livrat browserului.
      - name: Syntax-check shipped JavaScript
        run: npm run check:syntax

      # Versetele: o singură completare per verset, patru variante unice,
      # răspunsul prezent în variante și absent din restul textului.
      - name: Validate verses
        run: npm run validate:verses

      # Exercițiile epistolelor și cheile de răspunsuri din supabase/ trebuie să
      # corespundă versetelor livrate; altfel triggerul serverului ar marca
      # greșit răspunsuri corecte.
      - name: Generated exercises and answer keys are up to date
        run: npm run check:generated

      - name: Full verse texts match the reference
        run: npm run audit:reference

      # index.html și sw.js trebuie să refere exact aceleași URL-uri
      # cache-busted, altfel o instalare PWA curată rămâne fără fișiere offline.
      - name: Check asset versions
        run: npm run check:assets

      # Numele cu diacritice: bug-ul cu \b a aparut de doua ori, independent.
      - name: Username normalizer
        run: npm run check:names

      - name: Migration bundle preserves cycle fixes
        run: npm run check:migrations

      - name: Progress resumes at missing pages
        run: npm run check:progress

      - name: Scores belong to the authenticated account before category selection
        run: npm run check:account-score

      - name: Offline queue survives stale answers
        run: npm run check:offline-queue

      - name: Category change warns only when the epistle changes
        run: npm run check:category-warning

      - name: Reading day starts at 03:00 Romania time
        run: npm run check:reading-day

      - name: Chapters start on a new page
        run: npm run check:chapter-pages

      - name: Category routes, RLS and revisions on real PostgreSQL
        run: npm run check:category-db

      # Catalogul live de versete (folosit de triggerul events_validate_citim_insert)
      # trebuie să conțină epistolele, altfel serverul le respinge.
      - name: Deleting a user cascades to events and scores
        run: npm run check:fk-cascade

      - name: Epistles are added to the live verse catalog
        run: npm run check:epistle-catalog
